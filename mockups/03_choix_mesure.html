<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=375">
  <title>Maquette — Choix Mesure</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0F0F0F; color: #FAFAF8; font-family: 'Barlow', sans-serif; padding: 96px 32px 48px; }
    h1 { font-family: 'Barlow Condensed', sans-serif; font-weight: 900; font-size: 48px; color: #F4620F; margin-bottom: 8px; }
    .subtitle { font-size: 16px; color: #B8B0A4; margin-bottom: 32px; }
    .option { background: #2A2A2A; border-radius: 12px; padding: 24px; margin-bottom: 16px; border-left: 4px solid #F4620F; cursor: pointer; }
    .option h2 { font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 28px; color: #FAFAF8; margin-bottom: 4px; }
    .option p { font-size: 14px; color: #7A7A7A; }
  </style>
</head>
<body>
  <h1>QUE MESURER ?</h1>
  <p class="subtitle">Choisissez le type de mesure</p>
  <div class="option"><h2>SOL</h2><p>Carrelage, parquet, béton…</p></div>
  <div class="option"><h2>MUR</h2><p>Peinture, enduit, faïence…</p></div>
  <div class="option"><h2>CLÔTURE</h2><p>Longueur linéaire</p></div>
</body>
</html>
